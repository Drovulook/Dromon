[workspace]
members = ["Dromon-engine", "Dromon-cli", "apps/model_sandbox", "apps/Physis", "apps/ai_sandbox"]
resolver = "2"

# Optimise les dépendances (image, ash, glam…) même en build debug,
# tout en gardant le reste du code non optimisé (compilation rapide + debug).
[profile.dev.package."*"]
opt-level = 3
