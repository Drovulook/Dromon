[package]
name = "Dromon-engine"
version = "0.1.0"
edition = "2024"

[lib]
# Nom d'import propre côté binaires : `use dromon_engine::…` (sinon ce serait
# `Dromon_engine`, dérivé du nom de package avec tirets convertis en underscores).
name = "dromon_engine"

[features]
# Quand elle est absente, la macro `profile!` s'expanse en néant : aucune trace du
# profiling dans le binaire. Le launcher l'active via `--features Dromon-engine/profiling`
# selon `ENABLE_PROFILING`. Désactivée par défaut.
profiling = []

[dependencies]
anyhow = "1.0.102"
ash = "0.38.0"
ash-window = "0.13.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
softbuffer = "0.4"
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
gltf = "1.4.1"
noise = "0.9.0"
# HashMap à hash non-cryptographique (FxHash) : bien plus rapide que le SipHash par
# défaut sur des clés entières, pour les caches chauds du mailleur.
rustc-hash = "2"
# Parallélisme de données par vol de travail (work-stealing) : maille les chunks sur
# tous les cœurs. Chaque chunk est indépendant, `mesh_chunk` ne lit que `&manager`.
rayon = "1"
